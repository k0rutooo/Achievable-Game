[server]
enableStaticServing = true

[theme]
base = "dark"
primaryColor = "#ffffff"
backgroundColor = "#2b2b2b"
secondaryBackgroundColor = "#202020"
textColor = "#ffffff"
borderColor = "#868686"
headingFontWeights = [800, 600, 500, 400, 400]
headingFontSizes = ["3rem", "2.5rem", "2.25rem", "2rem", "1.5rem"]
font = "google-sans"
headingFont = "montserrat"

[theme.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#8d8d8d"
borderColor = "#878787"
font = "google-sans"
headingFont = "montserrat"